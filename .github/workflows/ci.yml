name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: fetch avm-proofpack test assets
        # Pinned to the commit 0.4.1 shipped from, so the evidence and the Falcon KAT
        # vectors the suite runs against cannot change underneath us.
        #
        # GitHub names the extracted root after the FULL sha even when a short ref is
        # requested, so the directory is resolved rather than assumed -- guessing it
        # is what turned this step red on the first attempt.
        run: |
          mkdir -p "$RUNNER_TEMP/pp"
          curl -fsSL \
            https://github.com/chopmob-cloud/avm-proofpack/archive/c97dcc3.tar.gz \
            | tar xz -C "$RUNNER_TEMP/pp"
          PP="$(find "$RUNNER_TEMP/pp" -maxdepth 1 -type d -name 'avm-proofpack-*' | head -1)"
          if [ -z "$PP" ]; then echo "archive extracted to no known directory"; exit 1; fi
          for f in "tests/fixtures/stake_attested_algorand_66457600.json.gz" \
                   "tests/falcon_kat/falcon1024_det_kat.json"; do
            test -f "$PP/$f" || { echo "missing $f in the pinned archive"; exit 1; }
            ls -l "$PP/$f"
          done
          echo "AVM_PROOFPACK_TESTS=$PP/tests" >> "$GITHUB_ENV"
      - name: suite
        # A skip here would mean the crypto paths silently did not run, which is how
        # a green tick covers 81 fewer tests than the gate. The fixture is required.
        env:
          AVM_MESH_REQUIRE_FIXTURE: "1"
        run: python -m pytest tests -q -rs -m 'not signer'

  artefacts:
    name: artefacts (licence + metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        # pytest and the runtime dependencies are installed because the artefact check
        # now extracts the sdist and collects its tests. A recipient of the sdist would
        # install these before running the suite, so the check mirrors that.
        run: |
          python -m pip install --upgrade pip build twine pytest avm-proofpack avm-effectproof
          python -m build --outdir dist .
      - name: twine check
        run: python -m twine check dist/*
      - name: licence and metadata inside the artefacts
        run: python tools/check_artifacts.py dist


  a2a-conformance:
    name: a2a TCK (jsonrpc, must)
    runs-on: ubuntu-latest
    # Hard gate: the run on 9dab2cd was green (80 passed, 0 failed after the
    # content-type fix). A conformance regression should fail CI, not whisper.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch a2a-tck
        run: git clone --depth 1 https://github.com/chopmob-cloud/a2a-tck.git /tmp/a2a-tck
      - name: install
        # Every dependency the SUT and the TCK runner need is named explicitly.
        # The first CI attempt died twice for absent packages (starlette, then
        # pytest) and the SUT failure was invisible because the health loop only
        # printed curl errors -- the log is now dumped on failure.
        run: |
          python -m pip install --upgrade pip
          python -m pip install . starlette uvicorn a2a-sdk sse-starlette \
              grpcio protobuf googleapis-common-protos httpx jsonschema \
              pytest pytest-asyncio pytest-html gherkin-official Jinja2
      - name: start SUT
        env:
          SUT_HOST: localhost:9999
          GRPC_PORT: "10000"
        run: |
          nohup python tools/sut/avm_sut.py > /tmp/sut.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9999/.well-known/agent-card.json > /tmp/card.json; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "SUT did not answer on :9999 -- its log follows"
            cat /tmp/sut.log
            exit 1
          fi
          echo "=== agent card ==="
          cat /tmp/card.json
      - name: run TCK
        env:
          PYTHONPATH: /tmp/a2a-tck
        run: |
          cd /tmp/a2a-tck
          python run_tck.py --sut-host http://localhost:9999 --level must --transport jsonrpc

  branch-hygiene:
    # A direct commit to main is invisible: the suite is green whether the change
    # arrived through review or around it. This job makes the difference visible on
    # a push (a pushed commit is not a merge commit) and does nothing on a PR, where
    # the question does not arise.
    #
    # It cannot block the push -- GitHub branch protection would, and that is
    # unavailable on a private repository without a paid plan (the API answers
    # "Upgrade to GitHub Pro"). So this reports rather than prevents, and the local
    # guard in tools/hooks/pre-push is what prevents.
    name: main came through a pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: check the head commit is a merge
        run: |
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          subject=$(git log -1 --format=%s)
          if [ "$parents" -lt 3 ]; then
            echo "::error::main moved by a direct push, not a merged pull request."
            echo "head subject: $subject"
            echo ""
            echo "A commit that arrives on main without review looks identical in the"
            echo "log to one that arrived through it, and CI is green either way."
            echo "Open a branch and a pull request next time: see CONTRIBUTING.md."
            echo ""
            echo "If this was a deliberate emergency, re-run the job with the"
            echo "AVM_ALLOW_MAIN_PUSH=1 repository variable set, and say why in the"
            echo "commit message."
            exit 1
          fi
          echo "head commit is a merge of ${parents} parents: arrived through a PR"
