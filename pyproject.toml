[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "avm-mesh"
version = "0.10.2"
description = "Settlement receipts for the AVM mesh: digest-and-pointer evidence that resolves to a verifiable proofpack"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: an SPDX expression plus explicit licence files. The estate standard
# (memory-graph claims 11229, 4594): licence text must travel in both artifacts.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "AlgoVoi", email = "chopmob@gmail.com"}]
keywords = ["algorand", "voi", "avm", "state-proof", "settlement", "a2a", "x402", "falcon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
    "Topic :: Office/Business :: Financial",
    "Operating System :: OS Independent",
]
dependencies = ["avm-proofpack>=0.4.1", "avm-effectproof>=0.1.1"]

[project.scripts]
avm-mesh = "avm_mesh.cli:main"

[project.urls]
Homepage = "https://github.com/chopmob-cloud/avm-mesh"
Repository = "https://github.com/chopmob-cloud/avm-mesh"
Issues = "https://github.com/chopmob-cloud/avm-mesh/issues"
Changelog = "https://github.com/chopmob-cloud/avm-mesh/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
markers = [
    "signer: optional test-only Falcon signing acceptance path, requires pqcrypto 0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
