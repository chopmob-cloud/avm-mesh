name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: fetch the mainnet fixture
        # Pinned to the avm-proofpack commit that 0.4.1 shipped from, so the evidence
        # the suite runs against cannot change underneath us.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/fixture.json.gz" \
            https://raw.githubusercontent.com/chopmob-cloud/avm-proofpack/c97dcc3/tests/fixtures/stake_attested_algorand_66457600.json.gz
          ls -l "$RUNNER_TEMP/fixture.json.gz"
      - name: suite
        # A skip here would mean the crypto paths silently did not run, which is how
        # a green tick covers 81 fewer tests than the gate. The fixture is required.
        env:
          AVM_MESH_FIXTURE: ${{ runner.temp }}/fixture.json.gz
          AVM_MESH_REQUIRE_FIXTURE: "1"
        run: python -m pytest tests -q -rs

  artefacts:
    name: artefacts (licence + metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist .
      - name: twine check
        run: python -m twine check dist/*
      - name: licence and metadata inside the artefacts
        run: python tools/check_artifacts.py dist
