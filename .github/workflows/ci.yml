name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: suite
        # Skips are reported but not fatal here; the clean-room gate on VM2 treats
        # a skip as a failure, and that is the gate a release must pass.
        run: python -m pytest tests -q

  artefacts:
    name: artefacts (licence + metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist .
      - name: twine check
        run: python -m twine check dist/*
      - name: licence and metadata inside the artefacts
        run: python tools/check_artifacts.py dist
